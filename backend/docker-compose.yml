services:
  db:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_DB: sandsational_db
      POSTGRES_USER: user123
      POSTGRES_PASSWORD: user123
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network

  app:
    image: sandsational-service
    container_name: sandsational-service
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/sandsational_db
      SPRING_DATASOURCE_USERNAME: user123
      SPRING_DATASOURCE_PASSWORD: user123
      SPRING_PROFILES_ACTIVE: default
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_OPEN_IN_VIEW: false
      SPRING_JPA_SHOW_SQL: true
      JWT_SECRET: change-this-dev-secret-change-this-dev-secret-123456
    depends_on:
      - db
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local